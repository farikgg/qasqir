services:
  postgres:
    container_name: "database"
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-qasqir_bot_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-qasqir_bot_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    container_name: "core"
    build: .
    command: >
      sh -c "alembic upgrade head && 
             uvicorn src.app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - GATEWAY_URL=http://gateway:8000

  gateway:
    container_name: "gateway"
    build: .
    command: uvicorn gateway.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - core
    env_file:
      - .env
    environment:
      - CORE_SERVICE_URL=http://core:8001